<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Demonstration workspace, Muthu Fire Engineering Co.">
<title>Muthu Fire Operations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Aura Business design tokens, Aura Light and Dark, taken from the product. */
:root{
  --radius-card:14px; --radius-input:10px; --radius-button:10px;
  --text-xs:11px; --text-sm:13px; --text-base:14px; --text-md:16px; --text-lg:20px; --text-xl:24px;
  --track-caps:.04em; --sidebar-w:256px; --header-h:56px; --card-pad:20px;
  --bg-canvas:#DDE8E0; --bg-sidebar:#E6F0E9; --bg-sidebar-hover:#D5E5DA; --bg-header:#EDF4EF;
  --bg-card:#FFFFFF; --bg-subtle:#EEF5F0; --bg-input:#FFFFFF;
  --border-soft:#CCDBD2; --border-strong:#AEC2B5;
  --text-primary:#111827; --text-secondary:#4B5563; --text-muted:#6B7280; --section-head:#6B7280;
  --brand:#047857; --brand-dark:#065F46; --brand-light:#D1FAE5; --brand-soft:rgba(4,120,87,.08);
  --success:#15803D; --success-soft:#E7F6EC; --success-text:#14532D;
  --warning:#B45309; --warning-soft:#FDF3E3; --warning-text:#7C3E0B;
  --error:#B91C1C;   --error-soft:#FCEDED;   --error-text:#7F1D1D;
  --info:#1D4ED8;    --info-soft:#EAF0FE;    --info-text:#1E3A8A;
  --accent-alt:#6D28D9;
  --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
  --shadow-pop:0 10px 28px -14px rgba(16,24,40,.22), 0 2px 6px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-canvas:#12161B; --bg-sidebar:#161B21; --bg-sidebar-hover:#1D242C; --bg-header:#161B21;
    --bg-card:#171D24; --bg-subtle:#1A2027; --bg-input:#161C22;
    --border-soft:#262E37; --border-strong:#36404A;
    --text-primary:#E8EDF2; --text-secondary:#B7C2CD; --text-muted:#8C98A4; --section-head:#8C98A4;
    --brand:#10B981; --brand-dark:#059669; --brand-light:#10291F; --brand-soft:rgba(16,185,129,.12);
    --success:#34D399; --success-soft:#10291A; --success-text:#6EE7A8;
    --warning:#E3B341; --warning-soft:#2A1F0E; --warning-text:#E3B341;
    --error:#F08A8A;   --error-soft:#2C1414;   --error-text:#F08A8A;
    --info:#7DA6F5;    --info-soft:#15213A;    --info-text:#7DA6F5;
    --accent-alt:#A78BFA;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
    --shadow-pop:0 10px 28px -14px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-canvas:#12161B; --bg-sidebar:#161B21; --bg-sidebar-hover:#1D242C; --bg-header:#161B21;
  --bg-card:#171D24; --bg-subtle:#1A2027; --bg-input:#161C22;
  --border-soft:#262E37; --border-strong:#36404A;
  --text-primary:#E8EDF2; --text-secondary:#B7C2CD; --text-muted:#8C98A4; --section-head:#8C98A4;
  --brand:#10B981; --brand-dark:#059669; --brand-light:#10291F; --brand-soft:rgba(16,185,129,.12);
  --success:#34D399; --success-soft:#10291A; --success-text:#6EE7A8;
  --warning:#E3B341; --warning-soft:#2A1F0E; --warning-text:#E3B341;
  --error:#F08A8A;   --error-soft:#2C1414;   --error-text:#F08A8A;
  --info:#7DA6F5;    --info-soft:#15213A;    --info-text:#7DA6F5;
  --accent-alt:#A78BFA;
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.35);
  --shadow-pop:0 10px 28px -14px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{font-family:Inter,-apple-system,system-ui,sans-serif;margin:0;color:var(--text-primary);
  background:var(--bg-canvas);font-size:var(--text-base);line-height:1.5;-webkit-text-size-adjust:100%}
.ribbon{background:var(--warning-soft);color:var(--warning-text);border-bottom:1px solid var(--border-soft);font-size:var(--text-xs);font-weight:500}
.ribbon div{padding:.4rem max(16px,env(safe-area-inset-right,0px)) .4rem max(16px,env(safe-area-inset-left,0px))}
.app{display:flex;min-height:100vh}
aside{width:var(--sidebar-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--bg-sidebar);border-right:1px solid var(--border-soft)}
.logo{padding:0 1rem;height:var(--header-h);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:.75rem}
.logo .mark{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;flex-shrink:0;font-weight:700;color:#F5A623;font-size:17px;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.logo b{display:block;font-size:var(--text-sm);font-weight:700;color:#F5A623;line-height:1.3}
.logo span{display:block;font-size:var(--text-xs);color:#94A3B8}
nav{flex:1;overflow-y:auto;padding:.5rem 0}
.grp{margin-bottom:.25rem}
.grp>p{margin:0;padding:.5rem 1rem;font-size:var(--text-xs);font-weight:600;letter-spacing:.025em;text-transform:uppercase;color:var(--section-head);display:flex;align-items:center;gap:.5rem}
.grp>p svg{width:14px;height:14px;opacity:.7}
nav button{width:100%;text-align:left;display:flex;align-items:center;gap:.75rem;font:400 var(--text-sm)/1.4 Inter,sans-serif;
  padding:.5rem 2.25rem;border:0;border-left:3px solid transparent;background:transparent;color:var(--text-secondary);cursor:pointer;transition:background 120ms}
nav button:hover{background:var(--bg-sidebar-hover);color:var(--text-primary)}
nav button[aria-current="true"]{padding-left:calc(2.25rem - 3px);border-left-color:var(--brand);color:var(--brand);font-weight:600;background:var(--brand-soft)}
nav button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
nav button .ico{width:16px;height:16px;flex-shrink:0;margin-left:-1.1rem}
nav button .badge{margin-left:auto;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#EF4444;color:#fff;font-size:10px;font-weight:700;line-height:18px;text-align:center}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.bar{background:var(--bg-header);border-bottom:1px solid var(--border-soft);height:var(--header-h);display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:10;
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
header.bar h1{font-size:var(--text-md);font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;display:flex;align-items:center;gap:.5rem;background:var(--bg-input);border:1px solid var(--border-soft);border-radius:var(--radius-input);padding:.35rem .6rem;color:var(--text-muted);font-size:var(--text-sm);max-width:15rem;flex:1}
.who{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.who .av{width:30px;height:30px;border-radius:999px;background:var(--brand-light);color:var(--brand);display:grid;place-items:center;font-size:var(--text-xs);font-weight:700}
.who .nm{font-size:var(--text-xs);line-height:1.3}
.who .nm b{display:block;font-size:var(--text-sm);font-weight:600}
.who .nm span{color:var(--text-muted)}
@media (max-width:1023px){
  .app{flex-direction:column}
  aside{width:auto;border-right:0;border-bottom:1px solid var(--border-soft)}
  .logo{padding-left:max(16px,env(safe-area-inset-left,0px))}
  nav{display:flex;overflow-x:auto;padding:0}
  .grp{display:flex;margin:0}
  .grp>p{display:none}
  nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:.7rem .8rem}
  nav button[aria-current="true"]{padding-left:.8rem;border-left:0;border-bottom-color:var(--brand)}
  nav button .ico{margin-left:0}
  .search{display:none}
}
.page{padding:1.25rem max(16px,env(safe-area-inset-right,0px)) 2.5rem max(16px,env(safe-area-inset-left,0px));max-width:1400px;width:100%}
.lede{color:var(--text-secondary);font-size:var(--text-sm);margin:0 0 1.1rem;max-width:72ch}
h2.sec{font-size:var(--text-sm);font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.025em;margin:1.4rem 0 .6rem}
h2.sec:first-of-type{margin-top:0}
.stat-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));margin-bottom:1.5rem}
.kpi{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-card);padding:var(--card-pad);box-shadow:var(--shadow-card);overflow:hidden;min-width:0}
.kpi .lab{font-size:var(--text-xs);font-weight:600;letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--text-muted)}
.kpi .val{font-size:var(--text-xl);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:.35rem;line-height:1.15}
.kpi .sub{font-size:var(--text-sm);color:var(--text-muted);margin-top:.3rem}
.kpi.bad .val{color:var(--error)} .kpi.warn .val{color:var(--warning)} .kpi.good .val{color:var(--success)} .kpi.alt .val{color:var(--accent-alt)}
.card{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-card);box-shadow:var(--shadow-card);margin-bottom:1.25rem;overflow:hidden}
.card>.head{padding:.85rem var(--card-pad);border-bottom:1px solid var(--border-soft);display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline}
.card>.head h3{margin:0;font-size:var(--text-base);font-weight:600}
.card>.head .note{font-size:var(--text-sm);color:var(--text-muted)}
.card>.head .right{margin-left:auto;font-size:var(--text-sm);color:var(--text-muted)}
.card .body{padding:var(--card-pad)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--text-sm);min-width:44rem}
thead th{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.02em;color:var(--text-muted);background:var(--bg-subtle);border-bottom:1px solid var(--border-soft);padding:.7rem .75rem;text-align:left;font-weight:600;white-space:nowrap}
tbody td{padding:.65rem .75rem;border-bottom:1px solid var(--border-soft);vertical-align:top;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg-subtle)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{padding:.7rem .75rem;background:var(--bg-subtle);font-weight:600;border-top:1px solid var(--border-strong);font-variant-numeric:tabular-nums}
.dim{color:var(--text-muted);font-size:var(--text-xs)}
.pill{display:inline-block;padding:.2rem .5rem;border-radius:999px;font-size:var(--text-xs);font-weight:600;white-space:nowrap}
.pill.bad{background:var(--error-soft);color:var(--error-text)}
.pill.warn{background:var(--warning-soft);color:var(--warning-text)}
.pill.good{background:var(--success-soft);color:var(--success-text)}
.pill.info{background:var(--info-soft);color:var(--info-text)}
.pill.flat{background:var(--bg-subtle);color:var(--text-muted)}
.btn{display:inline-block;border:0;border-radius:var(--radius-button);background:var(--brand);color:#fff;font:600 var(--text-sm)/1 Inter,sans-serif;padding:.5rem .8rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.quiet{background:var(--bg-subtle);color:var(--text-secondary);border:1px solid var(--border-soft)}
.docgrid{display:flex;flex-wrap:wrap;gap:1.25rem;justify-content:space-between;padding:var(--card-pad);border-bottom:1px solid var(--border-soft)}
.docgrid b{font-size:var(--text-md);display:block;margin-bottom:.25rem}
.docgrid .meta{font-size:var(--text-sm);color:var(--text-secondary);line-height:1.8}
.totals{display:flex;justify-content:flex-end;padding:var(--card-pad);background:var(--bg-subtle);border-top:1px solid var(--border-soft)}
.totals table{min-width:0;width:auto}
.totals td{border:0;padding:.2rem .7rem;white-space:nowrap}
.totals tr:last-child td{border-top:1px solid var(--border-strong);font-weight:700;padding-top:.45rem}
.phone{max-width:20rem;border:1px solid var(--border-strong);border-radius:20px;overflow:hidden;background:var(--bg-card);box-shadow:var(--shadow-pop)}
.phone .pt{background:var(--brand);color:#fff;padding:.8rem 1rem;font-weight:600;font-size:var(--text-sm);display:flex;justify-content:space-between;align-items:center}
.phone .pt small{font-weight:400;opacity:.85;font-size:var(--text-xs)}
.phone .pb{padding:1rem}
.stp{display:flex;gap:.65rem;padding:.6rem 0;border-bottom:1px solid var(--border-soft);font-size:var(--text-sm)}
.stp:last-of-type{border-bottom:0}
.stp .d{flex:0 0 20px;height:20px;border-radius:999px;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:.1rem}
.stp.done .d{background:var(--success);color:#fff}
.stp.now .d{background:var(--warning);color:#fff}
.stp.todo .d{background:var(--bg-subtle);color:var(--text-muted);border:1px solid var(--border-soft)}
.sig{margin-top:.8rem;border:1px dashed var(--border-strong);border-radius:var(--radius-input);padding:.8rem;text-align:center;font-size:var(--text-xs);color:var(--text-muted)}
.wagrid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr))}
.wa{background:var(--success-soft);border:1px solid var(--success);border-radius:var(--radius-card) var(--radius-card) var(--radius-card) 2px;padding:.8rem .9rem;font-size:var(--text-sm)}
.wa .who2{font-weight:600;font-size:var(--text-xs);color:var(--success-text);margin-bottom:.35rem}
.wa .when{font-size:var(--text-xs);color:var(--text-muted);margin-top:.5rem}
.foot{font-size:var(--text-sm);color:var(--text-muted);max-width:72ch;border-top:1px solid var(--border-soft);padding-top:1rem}
/* assistant */
.ask{display:flex;gap:.5rem;align-items:center;background:var(--bg-input);border:1px solid var(--border-strong);border-radius:var(--radius-input);padding:.6rem .8rem;margin-bottom:1rem}
.ask input{flex:1;border:0;background:transparent;font:400 var(--text-base)/1.4 Inter,sans-serif;color:var(--text-primary);outline:none;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem}
.chip{border:1px solid var(--border-soft);background:var(--bg-card);border-radius:999px;padding:.35rem .7rem;font-size:var(--text-sm);color:var(--text-secondary);cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.answer{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-card) var(--radius-card) 0;padding:1rem var(--card-pad);margin-bottom:1rem}
.answer p{margin:0 0 .6rem}
.draft{border:1px dashed var(--border-strong);border-radius:var(--radius-card);padding:1rem;background:var(--bg-card)}
.draft .hd{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--track-caps);font-weight:600;color:var(--accent-alt);margin-bottom:.5rem}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
/* scope */
.scope{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr))}
.scope .blk{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-card);padding:var(--card-pad);box-shadow:var(--shadow-card)}
.scope h4{margin:0 0 .5rem;font-size:var(--text-sm);text-transform:uppercase;letter-spacing:var(--track-caps);color:var(--brand)}
.scope ul{margin:0;padding-left:1.1rem}
.scope li{font-size:var(--text-sm);margin-bottom:.3rem;color:var(--text-secondary)}
.price{background:var(--bg-card);border:1px solid var(--brand);border-radius:var(--radius-card);padding:var(--card-pad);box-shadow:var(--shadow-card);margin-top:1.25rem}
.price .amt{font-size:var(--text-xl);font-weight:700;letter-spacing:-.02em;color:var(--brand)}

/* ---- interactive additions ---- */
input,select,textarea{font-family:inherit;font-size:var(--text-sm);color:var(--text-primary);
  background:var(--bg-input);border:1px solid var(--border-soft);border-radius:var(--radius-input);padding:.4rem .55rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
select{cursor:pointer}
.btn{transition:filter 120ms}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:.3rem .55rem;font-size:var(--text-xs)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hint{display:flex;gap:.6rem;align-items:flex-start;background:var(--info-soft);color:var(--info-text);
  border:1px solid var(--info);border-radius:var(--radius-card);padding:.65rem .85rem;font-size:var(--text-sm);margin-bottom:1.1rem}
.hint b{font-weight:600}
.hint svg{flex:0 0 16px;margin-top:.15rem}
.toastwrap{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:60;
  max-width:min(24rem,calc(100vw - 2rem));pointer-events:none}
.toast{background:var(--bg-card);border:1px solid var(--border-strong);border-left:4px solid var(--brand);
  border-radius:var(--radius-card);box-shadow:var(--shadow-pop);padding:.7rem .85rem;font-size:var(--text-sm);
  animation:tin 180ms ease-out}
.toast.good{border-left-color:var(--success)} .toast.warn{border-left-color:var(--warning)} .toast.bad{border-left-color:var(--error)}
.toast b{display:block;font-weight:600;margin-bottom:.1rem}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.42);display:grid;place-items:center;z-index:70;padding:1rem}
.modalbox{background:var(--bg-card);border-radius:16px;box-shadow:var(--shadow-modal,0 28px 56px -28px rgba(16,24,40,.34));
  max-width:34rem;width:100%;max-height:85vh;overflow:auto;border:1px solid var(--border-soft)}
.modalbox .mh{padding:1rem var(--card-pad);border-bottom:1px solid var(--border-soft);font-weight:600;font-size:var(--text-md)}
.modalbox .mb{padding:var(--card-pad);font-size:var(--text-sm);color:var(--text-secondary)}
.modalbox .mf{padding:.85rem var(--card-pad);border-top:1px solid var(--border-soft);display:flex;gap:.5rem;justify-content:flex-end;background:var(--bg-subtle)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.tools input[type="search"]{min-width:14rem;flex:1;max-width:22rem}
.seg{display:inline-flex;border:1px solid var(--border-soft);border-radius:var(--radius-input);overflow:hidden}
.seg button{border:0;background:var(--bg-card);color:var(--text-secondary);font:500 var(--text-sm)/1 Inter,sans-serif;padding:.45rem .7rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.sigpad{width:100%;max-width:17rem;height:96px;border:1px dashed var(--border-strong);border-radius:var(--radius-input);
  background:var(--bg-input);touch-action:none;display:block;cursor:crosshair}
.srch{position:relative}
.srch input{width:100%}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg-card);border:1px solid var(--border-strong);
  border-radius:var(--radius-card);box-shadow:var(--shadow-pop);max-height:19rem;overflow:auto;z-index:30}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:.5rem .7rem;
  font:400 var(--text-sm)/1.4 Inter,sans-serif;color:var(--text-primary);cursor:pointer;border-bottom:1px solid var(--border-soft)}
.results button:hover{background:var(--bg-subtle)}
.results button:last-child{border-bottom:0}
.empty{padding:2rem var(--card-pad);text-align:center;color:var(--text-muted);font-size:var(--text-sm)}
.resetbtn{border:1px solid var(--border-soft);background:var(--bg-card);color:var(--text-secondary);
  border-radius:var(--radius-button);font:500 var(--text-xs)/1 Inter,sans-serif;padding:.45rem .6rem;cursor:pointer;flex-shrink:0}
.resetbtn:hover{border-color:var(--brand);color:var(--brand)}
tr.pick{cursor:pointer}
.answer.warn{border-left-color:var(--warning);background:var(--warning-soft)}
.answer .chips{margin:.2rem 0 0}
.wamsg{white-space:pre-wrap;font-family:inherit;font-size:var(--text-sm);color:var(--text-primary);
  background:var(--bg-subtle);border:1px solid var(--border-soft);border-radius:10px;padding:.75rem;margin:.6rem 0 0}
.sidefoot{display:flex;flex-direction:column;gap:.25rem;align-items:flex-end;margin-left:auto;flex-shrink:0}
#sbadge{line-height:1.25;text-align:right;max-width:13rem}
header.bar h1{flex:0 1 auto;min-width:3.5rem}

function svgBars(rows,fmt){
 const tilt=rows.length>5||rows.some(r=>r[0].length>14);
 const W=560,H=tilt?268:240,PL=46,PR=10,PT=16,PB=tilt?66:38;
 const max=nice(Math.max(1,...rows.map(r=>r[1])));
 const iw=W-PL-PR, ih=H-PT-PB, step=iw/rows.length, bw=Math.min(54,step-10);
 const y=v=>PT+ih-(v/max)*ih;
 const ticks=[0,max/2,max];
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
  ${ticks.map(t=>`<line class="gl" x1="${PL}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}"/>
    <text class="lbl" x="${PL-7}" y="${y(t)+3.5}" text-anchor="end">${esc(fmt?fmt(t,true):String(Math.round(t)))}</text>`).join("")}
  ${rows.map((r,i)=>{ const h=Math.max(r[1]>0?2:0,(r[1]/max)*ih), x=PL+i*step+(step-bw)/2;
    return `<g class="mark"><title>${esc(r[0])}: ${esc(fmt?fmt(r[1]):String(r[1]))}</title>
     <path d="${barPath(x,y(r[1]),bw,h,4)}" fill="${r[2]||"var(--c1)"}"/>
     <text class="val" x="${x+bw/2}" y="${y(r[1])-6}" text-anchor="middle">${esc(fmt?fmt(r[1]):String(r[1]))}</text></g>`; }).join("")}
  ${rows.map((r,i)=>{ const x=PL+i*step+step/2, ly=H-PB+15;
    if(tilt) return `<text class="lbl" x="${x}" y="${ly}" text-anchor="end" transform="rotate(-32 ${x} ${ly})">${esc(r[0])}</text>`;
    const w=r[0].split(" ");

    return `<text class="lbl" x="${x}" y="${ly+1}" text-anchor="middle">${esc(l1)}</text>

function svgDonut(rows,centreLab){
 const W=300,H=240,cx=150,cy=112,R=92,r=60;
 const tot=rows.reduce((a,x)=>a+x[1],0)||1;
 let a0=-Math.PI/2;
 const arc=(a,b)=>{ const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(b),y2=cy+R*Math.sin(b);
   const x3=cx+r*Math.cos(b),y3=cy+r*Math.sin(b),x4=cx+r*Math.cos(a),y4=cy+r*Math.sin(a);
   const big=(b-a)>Math.PI?1:0;
   return `M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z`; };
 const segs=rows.map(x=>{ const a1=a0+(x[1]/tot)*Math.PI*2; const d=arc(a0,a1); a0=a1;
   return `<g class="mark"><title>${esc(x[0])}: ${x[1]} (${Math.round(x[1]/tot*100)}%)</title>
     <path d="${d}" fill="${x[2]}" stroke="var(--bg-card)" stroke-width="2"/></g>`; }).join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${segs}
  <text class="hero" x="${cx}" y="${cy+2}" text-anchor="middle">${tot}</text>
  <text class="heros" x="${cx}" y="${cy+18}" text-anchor="middle">${esc(centreLab)}</text></svg>`;
}

   gstin:gstinFor(i),phone:"98"+(43000000+i*131317),sector:SECTOR[i%10],
   limit:[300000,500000,400000,250000,200000,150000,350000,250000,300000,200000][i%10],
   days:[45,45,30,45,30,15,45,30,45,30][i%10],site:i}));
 EXTRA.forEach((e,j)=>out.push({name:e[0],area:e[1],city:e[2],pin:e[3],gstin:"33"+GSTT[(j+3)%10],
   phone:e[4],sector:SECTOR2[j%6],limit:[200000,250000,150000,1000000,150000,200000][j%6],
   days:[30,30,30,60,30,30][j%6],site:-1}));
 return out;
}
function custPeople(c){ const i=c.site>=0?c.site:(c.name.length%NAMEP.length); return NAMEP[i%NAMEP.length]; }
function health(c){
 const owed=PAY.filter(p=>p[1]===c.name).reduce((a,b)=>a+payLeft(b),0);
 const late=PAY.some(p=>p[1]===c.name&&p[6]>0&&payLeft(p)>0);
 const uncovered=LEAK.filter(r=>r[2]===c.name&&r[5]!=="in_warranty").length;
 if(late||owed>c.limit) return "at-risk";
 if(uncovered||owed>0) return "watch";
 return "healthy";
}

function findCusts(q){
 const all=CUSTS(); const w=(q||"").toLowerCase().split(/\s+/).filter(Boolean);
 if(!w.length) return all;
 return all.filter(c=>{ const hay=[c.name,c.city,c.area,c.gstin,c.phone].join(" ").toLowerCase();
   return w.every(t=>hay.includes(t)); });
}
function standing(name){

   :"Rate contract "+c.ref+" expired on "+c.to+", so this quotation goes at list price.")
   :"No rate contract. Everything is quoted at list price.";
 return rc+" Credit 45 days. "+(owed?INR(owed)+" overdue.":INR(0)+" overdue.");
}
function applyCustomer(name){
 QT.cust=name;

   l.rate=l.list; l.disc=pct;

function waSummary(name){
 const owed=PAY.filter(p=>p[1]===name).reduce((a,b)=>a+payLeft(b),0);
 const quotes=QTLIST.filter(q=>q[1]===name&&(q[4]==="Sent"||q[4]==="Accepted")).length
   +(ENQ.filter(e=>e[2]===name&&e[7]==="Quoted").length);
 const tickets=TICKETS.filter(t=>t[1]===name&&t[4]!=="closed"&&t[4]!=="resolved").length;
 const uncovered=LEAK.filter(r=>r[2]===name&&r[5]!=="in_warranty").length;
 return {owed,quotes,tickets,uncovered};
}
function waJobs(c){
 const sm=waSummary(c.name), out=[];
 const late=PAY.find(p=>p[1]===c.name&&p[6]>0&&payLeft(p)>0);
 if(late) out.push(["bad","Payment follow up","Madam, invoice "+late[0]+" for "+INR(payLeft(late))+" was raised on "+late[2]+" and is now "+late[6]+" days past the "+c.days+" day terms. Kindly advise the payment date.\n\n"+CO.n+"\n"+CO.ph]);
 if(sm.uncovered) out.push(["warn","Cover has lapsed","Sir, "+sm.uncovered+" units at "+c.name+" are out of warranty with no live contract on them. We can put them back under an annual contract at "+INR(LEAK.filter(r=>r[2]===c.name&&r[5]!=="in_warranty").reduce((a,r)=>a+r[7],0))+" a year, which covers refilling, pressure testing and the service visits. Shall I send the quotation?\n\n"+CO.n+"\n"+CO.ph]);
 const tk=TICKETS.find(t=>t[1]===c.name&&t[4]!=="closed"&&t[4]!=="resolved");
 if(tk) out.push(["info","Service call update","Sir, service call "+tk[0]+" at "+c.name+" is with "+(tk[6]||"our office")+(tk[7]==="overdue"?" and is already past the time we promised, for which I am sorry.":" and is due "+tk[7]+".")+" We will confirm once the engineer is on site.\n\n"+CO.n+"\n"+CO.ph]);
 const unit=UNITS.find(u=>u[2]===c.name&&u[6]!=="good");
 if(unit) out.push(["warn","Refill is due","Sir, unit "+unit[0]+" at "+c.name+" ("+unit[1]+", "+unit[3]+") is "+unit[5].toLowerCase()+". An inspector will ask for it. We can attend this week.\n\n"+CO.n+"\n"+CO.ph]);
 if(!out.length) out.push(["good","Nothing is pending","Sir, everything at "+c.name+" is covered, attended and settled. We will be in touch before the next refill falls due.\n\n"+CO.n+"\n"+CO.ph]);
 return out;
}

function hostEl(id,cls){
  let el=document.getElementById(id);
  if(!el){ el=document.createElement("div"); el.id=id; if(cls) el.className=cls; document.body.appendChild(el); }
  return el;
}
function toast(kind,title,msg){
  const w=hostEl("toasts","toastwrap"); const d=document.createElement("div");
  d.className="toast "+kind; const b=document.createElement("b"); b.textContent=title; d.appendChild(b);
  if(msg){ const s=document.createElement("div"); s.textContent=msg; d.appendChild(s); }
  w.appendChild(d); setTimeout(()=>d.remove(),4200);
}
function modal(title,body,okLabel,onOk){
  const host=hostEl("modal");
  const bg=document.createElement("div"); bg.className="modalbg";
  const box=document.createElement("div"); box.className="modalbox";
  const h=document.createElement("div"); h.className="mh"; h.textContent=title;
  const b=document.createElement("div"); b.className="mb"; b.textContent=body;
  const f=document.createElement("div"); f.className="mf";
  const no=document.createElement("button"); no.className="btn quiet"; no.textContent="Later";
  const yes=document.createElement("button"); yes.className="btn"; yes.textContent=okLabel;
  no.onclick=()=>host.innerHTML=""; yes.onclick=()=>{ host.innerHTML=""; onOk&&onOk(); };
  f.append(no,yes); box.append(h,b,f); bg.appendChild(box); host.innerHTML=""; host.appendChild(bg);
  yes.focus();
}
function modalHTML(title,html,okLabel,onOk){
  const host=hostEl("modal");
  const bg=document.createElement("div"); bg.className="modalbg";
  const box=document.createElement("div"); box.className="modalbox";
  const h=document.createElement("div"); h.className="mh"; h.textContent=title;
  const b=document.createElement("div"); b.className="mb"; b.innerHTML=html;
  const f=document.createElement("div"); f.className="mf";
  const no=document.createElement("button"); no.className="btn quiet"; no.textContent=onOk?"Close":"Done";
  const yes=document.createElement("button"); yes.className="btn"; yes.textContent=okLabel||"Close";
  no.onclick=()=>host.innerHTML=""; yes.onclick=()=>{ host.innerHTML=""; onOk&&onOk(); };
  if(onOk) f.append(no,yes); else f.append(yes);
  box.append(h,b,f); bg.appendChild(box); host.innerHTML=""; host.appendChild(bg); yes.focus();
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const fn=ACT[el.dataset.act]; if(!fn) return; e.preventDefault(); fn(el.dataset,el);
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-chg]"); if(!el) return;
  const fn=CHG[el.dataset.chg]; if(fn) fn(+(el.dataset.i||0), el.value, el);
});
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-inp]"); if(!el) return;
  const fn=INP[el.dataset.inp]; if(fn) fn(el.value, +(el.dataset.i||0));
});
/* global search */
const GS=document.getElementById("gs"), GR=document.getElementById("gres");
function gsearch(){
  const q=(GS.value||"").trim().toLowerCase(); GR.innerHTML="";
  if(q.length<2) return;
  const hits=[];
  UNITS.forEach(u=>{ if((u[0]+u[1]+u[2]).toLowerCase().includes(q)) hits.push([u[0]+", "+u[1]+", "+u[2],"reg"]); });
  SITES.forEach(s=>{ if(s.s.toLowerCase().includes(q)) hits.push([s.s+", "+s.u+" units, "+s.due,"today"]); });
  TICKETS.forEach(t=>{ if((t[0]+t[1]+t[3]).toLowerCase().includes(q)) hits.push([t[0]+", "+t[1]+", "+t[3],"tick"]); });
  ENQ.forEach(x=>{ if((x[1]+x[2]).toLowerCase().includes(q)) hits.push([x[2]+", "+x[0]+" enquiry","enq"]); });
  if(!hits.length){ const d=document.createElement("div"); d.className="empty"; d.textContent="Nothing found"; GR.className="results"; GR.appendChild(d); return; }
  GR.className="results";
  hits.slice(0,9).forEach(([label,k])=>{ const b=document.createElement("button"); b.type="button"; b.textContent=label;
    b.onclick=()=>{ GS.value=""; GR.innerHTML=""; GR.className=""; show(k); }; GR.appendChild(b); });
}
GS.addEventListener("input",gsearch);
GS.addEventListener("blur",()=>setTimeout(()=>{GR.innerHTML="";GR.className="";},180));

 quote:"Press Amend, then change a quantity, a rate or a discount. Push one discount above 10 percent and see what happens.",
 rate:"Tiruppur expired in March. Anything quoted to them since then was at the wrong price.",
 tender:"The Pollachi bid is blocked by an expired certificate. The compliance vault can unblock it.",
 van:"Red means a job can fail tomorrow because the van is short.",
 supp:"Payables set against receivables, so you see the real cash position.",
 inv:"Raised from the job card, so the quantities are whatever the engineer actually did.",
 pay:"Record a payment on any overdue row and the chase stops.",
 rep:"Any of these can arrive on your WhatsApp every Monday morning.",
 settings:"Everything the documents read from. Locked here because the demo resets nightly, yours on your own system.",
 scope:"Everything you just clicked, built for your own firm, in thirty working days. The number at the bottom dials from a phone.",
};
function badges(){
  const counts={enq:ENQ.filter(e=>e[7]==="New").length,
    tick:TICKETS.filter(t=>t[7]==="overdue"||t[4]==="escalated").length,
    docs:DOCS.filter(d=>d[5]==="bad").length,
    tender:TENDERS.filter(t=>/Blocked/.test(t[9])).length,
    van:CAT.filter(p=>p[5]<=p[6]).length,
    leak:LEAK.filter(r=>r[5]!=="in_warranty"&&!r.offered).length};
  document.querySelectorAll("#nav button").forEach(b=>{
    const n=counts[b.dataset.k]; let el=b.querySelector(".badge");
    if(n){ if(!el){ el=document.createElement("span"); el.className="badge"; b.appendChild(el);} el.textContent=n; }
    else if(el) el.remove();
  });
}
function sigpad(){
  const c=document.getElementById("sigpad"); if(!c) return;
  const ctx=c.getContext("2d"); let drawing=false, any=false;
  ctx.lineWidth=3; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle=getComputedStyle(document.body).color;
  const pt=ev=>{ const r=c.getBoundingClientRect(); return [(ev.clientX-r.left)*(c.width/r.width),(ev.clientY-r.top)*(c.height/r.height)]; };
  c.addEventListener("pointerdown",ev=>{ drawing=true; c.setPointerCapture(ev.pointerId); const[x,y]=pt(ev); ctx.beginPath(); ctx.moveTo(x,y); });
  c.addEventListener("pointermove",ev=>{ if(!drawing) return; const[x,y]=pt(ev); ctx.lineTo(x,y); ctx.stroke(); any=true;
    const b=document.getElementById("jobdone"); if(b) b.disabled=false; });
  const end=()=>{ drawing=false; };
  c.addEventListener("pointerup",end); c.addEventListener("pointerleave",end); c.addEventListener("pointercancel",end);
}
document.addEventListener("keydown",e=>{
  if(!UI.csopen||CUR!=="quote") return;
  const hits=findCusts(UI.csq||"").slice(0,30);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault();
    UI.cshl=Math.max(0,Math.min((UI.cshl||0)+(e.key==="ArrowDown"?1:-1),hits.length-1));
    const pos=window.scrollY; document.getElementById("page").innerHTML=SCREEN.quote(); afterRender("quote"); window.scrollTo(0,pos); }
  else if(e.key==="Enter"){ const c=hits[Math.max(0,Math.min(UI.cshl||0,hits.length-1))];
    if(c){ e.preventDefault(); ACT.cspick({n:c.name}); } }
  else if(e.key==="Escape"){ e.preventDefault(); ACT.csclose(); }
});
function afterRender(k){
  badges();
  if(k==="quote"&&UI.csopen){ const el=document.getElementById("csq");
    if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
  if(k==="field") sigpad();
  if(k==="ai"){ const q=document.getElementById("q");
    document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ UI.q=c.textContent.trim(); if(q) q.value=UI.q; persist(); show("ai"); })); }
}
function show(k){
 CUR=k;
 const host=document.getElementById("page");
 host.innerHTML=(HINTS[k]?`<div class="hint"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg><div><b>Try this.</b> ${HINTS[k]}</div></div>`:"")+SCREEN[k]();
 document.getElementById("ptitle").textContent=TITLE[k];
 document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.k===k)));
 window.scrollTo(0,0);
 afterRender(k);
 try{ if(location.hash.slice(1)!==k) history.replaceState(null,"","#"+k) }catch(e){}
}
restore();
cloudBadge(); cloudPush();
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.k)));
let start=""; try{ start=location.hash.slice(1) }catch(e){}
show(SCREEN[start]?start:"today");
</script>
</body></html>
