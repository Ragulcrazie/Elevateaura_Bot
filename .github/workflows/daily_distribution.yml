name: Auto Daily Global Distribution

on:
  schedule:
    # Runs at 08:00 IST (02:30 UTC) every day
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  run-daily-distribution:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Get Date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Fix Windows line endings
      run: |
        sudo apt-get update
        sudo apt-get install -y dos2unix
        dos2unix ./blog/AUTO_DAILY_GLOBAL_DISTRIBUTION_ENGINE.sh
        chmod +x ./blog/AUTO_DAILY_GLOBAL_DISTRIBUTION_ENGINE.sh

    - name: Run Global Distribution Engine
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      run: |
        if [ -z "$BOT_TOKEN" ]; then
          echo "::warning::BOT_TOKEN secret is missing. Skipping execution."
          exit 0
        fi
        ./blog/AUTO_DAILY_GLOBAL_DISTRIBUTION_ENGINE.sh

    - name: Send Email Notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.OWNER_EMAIL }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        subject: "Daily SEO Distribution Pack - ${{ steps.date.outputs.date }}"
        body: |
          Your daily SEO distribution pack for SSC content is ready.
          
          Please find the attached guide for posting to Quora, Reddit, and Social Media.
        to: ${{ secrets.OWNER_EMAIL }}
        from: Elevate Aura Automation <${{ secrets.OWNER_EMAIL }}>
        secure: true
        attachments: distribution-packs/*.txt
